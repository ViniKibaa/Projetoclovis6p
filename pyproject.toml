[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-nn"
version = "1.0.0"
description = "Triagem de chamados de Helpdesk (categoria + urgência) com rede neural em NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
helpdesk-nn = "helpdesk_nn.__main__:main"

[tool.setuptools]
packages = ["helpdesk_nn"]

[tool.setuptools.package-data]
helpdesk_nn = ["web/*.html"]
